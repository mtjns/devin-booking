services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - storage-data:/var/www/html/storage
    ports:
      - "8080:80"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - storage-data:/var/www/html/storage

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - storage-data:/var/www/html/storage

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-devin_booking}
      MYSQL_USER: ${DB_USERNAME:-devin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me}
    command: --innodb-buffer-pool-size=64M --max-connections=50
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  backup:
    image: mysql:8.0
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        mysqldump -h db -u\"$$DB_USERNAME\" -p\"$$DB_PASSWORD\" \"$$DB_DATABASE\" |
        gzip > /backups/backup-$(date +%F-%H%M%S).sql.gz;
        find /backups -type f -mtime +14 -delete;
        sleep 86400;
      done"

  caddy:
    image: caddy:latest
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  storage-data:
  vendor-data:
  caddy-data:
  caddy-config:

