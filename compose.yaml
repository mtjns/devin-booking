services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - storage-data:/var/www/html/storage
      - vendor-data:/var/www/html/vendor
    expose:
      - 80
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - storage-data:/var/www/html/storage
      - vendor-data:/var/www/html/vendor
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: php artisan schedule:work
    volumes:
      - storage-data:/var/www/html/storage
      - vendor-data:/var/www/html/vendor
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.0.36@sha256:a532724022429812ec797c285c1b540a644c15e248579c6bfdf12a8fbaab4964
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --innodb-buffer-pool-size=256M --max-connections=100 --slow-query-log=ON --long-query-time=2
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: mysql:8.0.36
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        mysqldump -h db -u\"$$DB_USERNAME\" -p\"$$DB_PASSWORD\" \"$$DB_DATABASE\" |
        gzip > /backups/backup-$(date +%F-%H%M%S).sql.gz;
        find /backups -type f -mtime +30 -delete;
        sleep 86400;
      done"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  meilisearch:
    image: getmeili/meilisearch:v1.7.3@sha256:19b825993dbe80c61eec65de7e7096cd545a09a744d8d00f3dd117185ebb36f9
    restart: always
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meilisearch-data:/meili_data
    expose:
      - 7700
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--spider'
        - 'http://127.0.0.1:7700/health'
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.7.6
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  storage-data:
  vendor-data:
  caddy-data:
  caddy-config:
  meilisearch-data:

networks:
  default:
    name: devin-booking-prod

