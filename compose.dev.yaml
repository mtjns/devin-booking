services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .dev.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - storage-data:/var/www/html/storage
    ports:
      - "80:80"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .dev.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - storage-data:/var/www/html/storage

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: devin-booking-app:latest
    env_file:
      - .dev.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - storage-data:/var/www/html/storage

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .dev.env
    environment:
      DB_DATABASE: ${DB_DATABASE:-devin_booking}
      DB_USER: ${DB_USERNAME:-devin}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me}
    command:
      --innodb-buffer-pool-size=64M --max-connections=50
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "false"
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--spider'
        - 'http://127.0.0.1:7700/health'
      retries: 3
      timeout: 5s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
  storage-data:
  vendor-data:
  meilisearch-data:
